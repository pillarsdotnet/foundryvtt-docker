        https://github.com/foundryvtt/world-anvil/releases/download/1.5.1/module.json
        https://github.com/gioppoluca/sheet-export/releases/download/0.13.5/module.json
        https://github.com/ironmonk108/monks-bloodsplats/releases/latest/download/module.json
        https://github.com/ironmonk108/monks-combat-details/releases/latest/download/module.json
        https://github.com/ironmonk108/monks-little-details/releases/latest/download/module.json
        https://github.com/ironmonk108/monks-sound-enhancements/releases/latest/download/module.json
        https://github.com/ironmonk108/monks-wall-enhancement/releases/latest/download/module.json
        https://github.com/kgar/foundry-vtt-tidy-5e-sheets/releases/download/v10.3.2/module.json
