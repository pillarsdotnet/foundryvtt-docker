        https://github.com/theripper93/combat-tracker-dock/releases/download/4.0.1/module.json
        https://github.com/theripper93/enhancedcombathud-dnd5e/releases/download/5.0.0/module.json
        https://github.com/theripper93/enhancedcombathud/releases/download/4.0.4/module.json
        https://github.com/theripper93/token-z/releases/download/2.0.1/module.json
