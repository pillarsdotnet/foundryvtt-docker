---
secrets:
  config_json:
    file: secrets.json
services:
  foundry:
    build: .
    hostname: foundry
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - CONTAINER_CACHE=/data/container_cache
      - CONTAINER_CACHE_SIZE=2
      - CONTAINER_PATCHES=/data/foundry_patches
      # - CONTAINER_PATCH_URLS=
      #   https://raw.githubusercontent.com/felddy/...
      #   https://raw.githubusercontent.com/felddy/...
      # - CONTAINER_PRESERVE_CONFIG=false
      # - CONTAINER_URL_FETCH_RETRY=0
      - CONTAINER_VERBOSE=true
      # - FOUNDRY_AWS_CONFIG=
      # - |
      #   FOUNDRY_DEMO_CONFIG={
      #   "worldName": "demo-world",
      #   "sourceZip": "/data/demo-world.zip",
      #   "resetSeconds": 3600
      #   }
      - FOUNDRY_COMPRESS_WEBSOCKET=true
      - FOUNDRY_EXTENSIONS=
        https://raw.githubusercontent.com/foundryvtt/dnd5e/master/system.json
      - FOUNDRY_HOSTNAME=foundry.bobvincent.com
      # - FOUNDRY_HOT_RELOAD=false
      # - FOUNDRY_IP_DISCOVERY=
      # - FOUNDRY_LANGUAGE=
      - FOUNDRY_LOCAL_HOSTNAME=homelab.lan
      # - FOUNDRY_LICENSE_KEY=
      - FOUNDRY_MINIFY_STATIC_FILES=true
      # - FOUNDRY_PASSWORD_SALT=
      # - FOUNDRY_PROTOCOL=
      # - FOUNDRY_PROXY_PORT=
      # - FOUNDRY_PROXY_SSL=false
      # - FOUNDRY_RELEASE_URL=
      # - FOUNDRY_ROUTE_PREFIX=
      # - FOUNDRY_SSL_CERT=
      # - FOUNDRY_SSL_KEY=
      - FOUNDRY_TELEMETRY=false
      # - FOUNDRY_UPNP=false
      # - FOUNDRY_UPNP_LEASE_DURATION=
      - FOUNDRY_VERSION=13.346
      # - FOUNDRY_WORLD=
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host
    secrets:
      - source: config_json
        target: config.json
