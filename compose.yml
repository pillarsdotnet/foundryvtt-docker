        https://raw.githubusercontent.com/Saibot393/Rideable/v4.0.4/module.json
        https://raw.githubusercontent.com/kakaroto/Beyond20/refs/heads/master/FVTT-module/beyond20/module.json
        https://raw.githubusercontent.com/thomasjallerton/towngenerator-foundrymodule/main/module.json
      - FOUNDRY_PKG_SYS=
        https://raw.githubusercontent.com/foundryvtt/dnd5e/master/system.json
      # - FOUNDRY_PROTOCOL=
      # - FOUNDRY_PROXY_PORT=
      # - FOUNDRY_PROXY_SSL=false
      # - FOUNDRY_RELEASE_URL=
      # - FOUNDRY_ROUTE_PREFIX=
      # - FOUNDRY_SSL_CERT=
      # - FOUNDRY_SSL_KEY=
      - FOUNDRY_TELEMETRY=false
      # - FOUNDRY_UPNP=false
      # - FOUNDRY_UPNP_LEASE_DURATION=
      - FOUNDRY_VERSION=13.346
      # - FOUNDRY_WORLD=
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
        mode: host
    secrets:
      - source: config_json
        target: config.json
