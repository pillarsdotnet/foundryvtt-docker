---
secrets:
  config_json:
    file: secrets.json
services:
  foundry:
    build: .
    hostname: foundry
    volumes:
      - type: bind
        source: ./data
        target: /data
    environment:
      - CONTAINER_CACHE=/data/container_cache
      - CONTAINER_CACHE_SIZE=2
      - CONTAINER_PATCHES=/data/foundry_patches
      # - CONTAINER_PATCH_URLS=
      #   https://raw.githubusercontent.com/felddy/...
      #   https://raw.githubusercontent.com/felddy/...
      - CONTAINER_PRESERVE_CONFIG=false
      # - CONTAINER_URL_FETCH_RETRY=0
      - CONTAINER_VERBOSE=false
      # - FOUNDRY_AWS_CONFIG=
      # - |
      #   FOUNDRY_DEMO_CONFIG={
      #   "worldName": "demo-world",
      #   "sourceZip": "/data/demo-world.zip",
      #   "resetSeconds": 3600
      #   }
      - FOUNDRY_COMPRESS_WEBSOCKET=true
      - FOUNDRY_HOSTNAME=foundry.bobvincent.com
      # - FOUNDRY_HOT_RELOAD=false
      # - FOUNDRY_IP_DISCOVERY=
      # - FOUNDRY_LANGUAGE=
      - FOUNDRY_LOCAL_HOSTNAME=homelab.lan
      # - FOUNDRY_LICENSE_KEY=
      - FOUNDRY_MINIFY_STATIC_FILES=true
      # - FOUNDRY_PASSWORD_SALT=
      - FOUNDRY_PKG_MOD=
        https://github.com/ruipin/fvtt-lib-wrapper/releases/download/v1.13.3.0/module.json
        https://github.com/IamWarHead/ddb-game-log/releases/download/2.4.0/module.json
        https://github.com/MangoFVTT/fvtt-ready-set-roll-5e/releases/download/release-3.5.0/module.json
        https://github.com/Larkinabout/fvtt-custom-dnd5e/releases/download/2.0.3/module.json
        https://github.com/MrPrimate/ddb-importer/releases/download/latest/module.json
        https://github.com/TheDeckOfManyStrings/anewfoe/releases/download/1.0.3/module.json
        https://github.com/arcanistzed/pdf-sheet/releases/download/0.24.15/module.json
        https://github.com/dmarcuse/fvtt-adventure-bundler/releases/download/v0.2.5/module.json
        https://github.com/eryon/discord-to-fvtt/releases/download/v1.1.0/module.json
        https://github.com/fantasycalendar/FoundryVTT-ItemPiles/releases/download/3.2.15/module.json
        https://github.com/fantasycalendar/FoundryVTT-ItemPilesDnD5e/releases/download/1.0.4/module.json
